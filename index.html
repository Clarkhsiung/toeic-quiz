<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多益實戰字彙特訓場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
:root{
  --ink:#141b2e;
  --ink-soft:#2a3454;
  --paper:#f6f4ee;
  --panel:#ffffff;
  --line:#e3ddce;
  --gold:#b9862f;
  --gold-soft:#f1e4c8;
  --teal:#1f7a63;
  --teal-soft:#e0f2ea;
  --red:#b3452f;
  --red-soft:#fbe6e0;
}
*{box-sizing:border-box;}
html{ overflow-x:hidden; }
body{
  margin:0;
  overflow-x:hidden;
  background:var(--paper);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(20,27,46,0.06) 1px, transparent 0);
  background-size: 22px 22px;
  color:var(--ink);
  font-family:'Noto Sans TC','Space Grotesk',sans-serif;
}
h1,h2,.display{ font-family:'Space Grotesk','Noto Sans TC',sans-serif; letter-spacing:-0.01em; }
.mono{ font-family:'IBM Plex Mono', monospace; }

header.top{
  background:var(--ink);
  color:#f3efe2;
  padding:22px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:14px;
  border-bottom:4px solid var(--gold);
}
.brand{ display:flex; align-items:center; gap:14px; }
.brand-badge{
  width:44px;height:44px;border-radius:10px;
  background:var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-weight:700; color:var(--ink); font-family:'Space Grotesk',sans-serif;
  font-size:15px;
}
.brand h1{ font-size:20px; margin:0; font-weight:700; }
.brand p{ font-size:12px; margin:2px 0 0; color:#c7c1ad; }

.top-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; max-width:100%; }
.source-status{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.source-status.hidden{ display:none; }
.pill{
  display:flex; align-items:center; gap:6px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.18);
  padding:7px 12px; border-radius:999px; font-size:12px; color:#f0ecdd;
}
.upload-label{
  cursor:pointer;
  display:flex; align-items:center; gap:6px;
  background:var(--gold); color:var(--ink);
  padding:8px 14px; border-radius:999px; font-size:12px; font-weight:700;
}
.upload-label input{ display:none; }
.pill-warn{ background:rgba(179,69,47,0.28); border-color:rgba(179,69,47,0.55); color:#ffd9cd; }

main{ max-width:1080px; margin:0 auto; padding:26px 20px 60px; }

.tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px; }
.mode-tab{
  display:flex; align-items:center; gap:8px;
  padding:10px 16px; border-radius:12px;
  background:var(--panel); border:1px solid var(--line);
  font-size:13px; font-weight:700; color:var(--ink-soft);
  cursor:pointer;
}
.mode-tab .material-icons-round{ font-size:18px; }
.mode-tab-active{
  background:var(--ink); color:#f3efe2; border-color:var(--ink);
}

.panel-grid{ display:grid; grid-template-columns: 1.15fr 0.85fr; gap:22px; align-items:start; }
@media (max-width: 860px){ .panel-grid{ grid-template-columns: 1fr; } }

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:26px;
  box-shadow: 0 1px 0 rgba(20,27,46,0.03);
}

.quiz-label{ font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--gold); font-weight:700; margin:0 0 10px; }
.quiz-prompt{
  font-family:'Space Grotesk',sans-serif;
  font-size:30px; font-weight:600; line-height:1.35; color:var(--ink);
  margin-bottom:22px;
}
.quiz-prompt--sentence{ font-size:19px; font-family:'Noto Sans TC',sans-serif; font-weight:500; }

.options-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media (max-width:520px){ .options-grid{ grid-template-columns:1fr; } }
.option-btn{
  text-align:left;
  padding:13px 16px;
  border-radius:12px;
  border:1.5px solid var(--line);
  background:#fdfcf8;
  font-size:14px; font-weight:500; color:var(--ink);
  cursor:pointer;
  transition: border-color .15s, background .15s;
}
.option-btn:hover:not(:disabled){ border-color:var(--gold); background:var(--gold-soft); }
.option-btn:disabled{ cursor:default; }
.option-correct{ background:var(--teal-soft) !important; border-color:var(--teal) !important; color:#0f4a3a; font-weight:700; }
.option-wrong{ background:var(--red-soft) !important; border-color:var(--red) !important; color:#7a2c1a; font-weight:700; }

.listening-controls{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:20px; }
.play-btn{
  display:flex; align-items:center; gap:8px;
  background:var(--ink); color:#f3efe2; border:none;
  padding:12px 18px; border-radius:12px; font-weight:700; font-size:13px; cursor:pointer;
}
.mask-hint{
  font-size:26px; letter-spacing:6px; font-weight:600;
  padding:10px 16px; background:#fdfcf8; border:1.5px dashed var(--line); border-radius:12px;
}
.listen-form{ display:flex; gap:10px; }
.listen-input{
  flex:1; padding:13px 14px; border-radius:12px; border:1.5px solid var(--line);
  font-size:15px; font-family:'IBM Plex Mono',monospace;
}
.listen-input:focus{ outline:none; border-color:var(--gold); }
.input-correct{ border-color:var(--teal) !important; background:var(--teal-soft); }
.input-wrong{ border-color:var(--red) !important; background:var(--red-soft); }
.submit-btn{
  background:var(--gold); color:var(--ink); border:none; font-weight:700;
  padding:0 20px; border-radius:12px; cursor:pointer; font-size:13px;
}

.feedback-panel{ margin-top:22px; padding-top:20px; border-top:1px dashed var(--line); }
.feedback-panel.hidden{ display:none; }
.feedback-head{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; margin-bottom:10px; }
.feedback-head--correct{ color:var(--teal); }
.feedback-head--wrong{ color:var(--red); }
.feedback-word{ font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:600; margin:0 0 4px; }
.feedback-range{ font-size:11px; color:#8a8262; background:var(--gold-soft); padding:2px 8px; border-radius:999px; }
.feedback-meaning{ margin:0 0 10px; color:var(--ink-soft); font-size:14px; }
.feedback-your-answer{ font-size:13px; color:var(--red); margin:0 0 10px; }
.feedback-your-answer span{ font-weight:700; }
.feedback-example{ font-size:13px; background:#faf8f2; padding:12px 14px; border-radius:10px; margin:0 0 10px; line-height:1.6; }
.feedback-example-zh{ color:#8a8262; }
.feedback-tip{ font-size:12.5px; color:#6b6449; line-height:1.6; margin:0 0 16px; }
.next-btn{
  background:var(--ink); color:#f3efe2; border:none; padding:11px 20px;
  border-radius:12px; font-weight:700; font-size:13px; cursor:pointer;
}
.empty-note{ color:#8a8262; font-size:14px; }

.stats-card h2{ font-size:15px; margin:0 0 4px; }
.stats-card .sub{ font-size:12px; color:#8a8262; margin:0 0 16px; }
.stats-top{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:20px; }
.stat-box{ background:#faf8f2; border:1px solid var(--line); border-radius:12px; padding:10px 8px; text-align:center; }
.stat-box .num{ font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; }
.stat-box .lbl{ font-size:10.5px; color:#8a8262; margin-top:2px; }

.range-stats-title{ font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.06em; margin:0 0 10px; }
.range-legend{ display:flex; gap:14px; font-size:11px; color:#8a8262; margin-bottom:10px; }
.legend-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; }
.range-row{ margin-bottom:12px; }
.range-label{ font-size:12px; font-weight:700; margin-bottom:4px; font-family:'IBM Plex Mono',monospace; }
.range-bars{ display:flex; align-items:center; gap:8px; margin-bottom:3px; }
.range-bar-track{ flex:1; height:7px; background:#efeadb; border-radius:99px; overflow:hidden; }
.range-bar{ height:100%; border-radius:99px; }
.range-bar--correct{ background:var(--teal); }
.range-bar--wrong{ background:var(--red); }
.range-num{ font-size:11px; width:18px; text-align:right; font-family:'IBM Plex Mono',monospace; }
.range-num--correct{ color:var(--teal); }
.range-num--wrong{ color:var(--red); }

.reset-row{ display:flex; gap:8px; margin-top:18px; }
.ghost-btn{
  flex:1; background:none; border:1px solid var(--line); color:#8a8262;
  padding:9px; border-radius:10px; font-size:12px; cursor:pointer; font-weight:600;
}
.ghost-btn:hover{ border-color:var(--red); color:var(--red); }

/* ============ 手機／小螢幕優化 ============ */
@media (max-width: 640px){
  header.top{
    flex-direction:column;
    align-items:flex-start;
    padding:16px 16px;
    gap:12px;
  }
  .brand-badge{ width:38px; height:38px; font-size:12px; }
  .brand h1{ font-size:17px; }
  .brand p{ font-size:11px; }
  .top-actions{ width:100%; }
  .pill, .upload-label{ font-size:11px; padding:6px 10px; }
  .upload-label{ flex-shrink:0; }

  main{ padding:18px 14px 48px; }
  .tabs{ gap:6px; margin-bottom:16px; }
  .mode-tab{ padding:8px 12px; font-size:12px; flex:1 1 auto; justify-content:center; }
  .mode-tab .material-icons-round{ font-size:16px; }

  .card{ padding:18px; border-radius:14px; }

  .quiz-prompt{ font-size:22px; margin-bottom:18px; }
  .quiz-prompt--sentence{ font-size:16px; }
  .options-grid{ grid-template-columns:1fr; }
  .option-btn{ padding:12px 14px; font-size:13.5px; }

  .listening-controls{ gap:12px; }
  .mask-hint{ font-size:20px; letter-spacing:4px; padding:9px 12px; }
  .listen-form{ flex-direction:column; }
  .submit-btn{ padding:12px; }

  .stats-top{ grid-template-columns:repeat(2,1fr); }
  .feedback-word{ font-size:15.5px; }
  .quiz-label{ font-size:11px; }
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="brand-badge">TOEIC</div>
    <div>
      <h1>多益實戰字彙特訓場</h1>
      <p>四種模式 · 分數區間統計 · 間隔重複複習（SRS）</p>
    </div>
  </div>
  <div class="top-actions">
    <div class="source-status" id="source-status">
      <span class="pill" id="data-source-pill"><span class="material-icons-round" style="font-size:14px;">hourglass_top</span> 載入中…</span>
      <span class="pill"><span class="material-icons-round" style="font-size:14px;">database</span> 題庫 <b id="word-count">0</b> 筆</span>
    </div>
    <label class="upload-label">
      <span class="material-icons-round" style="font-size:14px;">upload_file</span> 上傳題庫 JSON
      <input type="file" id="json-file-input" accept=".json">
    </label>
  </div>
</header>

<main>
  <div class="tabs">
    <button class="mode-tab" id="tab-en2zh"><span class="material-icons-round">translate</span>單字中文選擇</button>
    <button class="mode-tab" id="tab-zh2en"><span class="material-icons-round">g_translate</span>單字英文選擇</button>
    <button class="mode-tab" id="tab-sentence"><span class="material-icons-round">format_quote</span>例句單字選擇</button>
    <button class="mode-tab" id="tab-listening"><span class="material-icons-round">hearing</span>聽力辨識</button>
  </div>

  <div class="panel-grid">
    <div class="card" id="quiz-area"></div>

    <div class="card stats-card">
      <h2>本模式作答統計</h2>
      <p class="sub">依 TOEIC 分數區間統計答對／答錯分佈，答錯題目將以 SRS 間隔重複排入後續複習。</p>

      <div class="stats-top">
        <div class="stat-box"><div class="num" id="stat-total">0</div><div class="lbl">總作答</div></div>
        <div class="stat-box"><div class="num" id="stat-correct">0</div><div class="lbl">答對</div></div>
        <div class="stat-box"><div class="num" id="stat-wrong">0</div><div class="lbl">答錯</div></div>
        <div class="stat-box"><div class="num" id="stat-acc">0%</div><div class="lbl">正確率</div></div>
      </div>

      <p class="range-stats-title">分數區間分佈</p>
      <div class="range-legend">
        <span><span class="legend-dot" style="background:var(--teal);"></span>答對</span>
        <span><span class="legend-dot" style="background:var(--red);"></span>答錯</span>
      </div>
      <div id="range-stats-body"></div>

      <p class="range-stats-title" style="margin-top:16px;">待優先複習（近期答錯）<span class="mono" id="stat-review" style="float:right;color:var(--red);">0</span></p>

      <div class="reset-row">
        <button class="ghost-btn" id="reset-mode-btn">重置本模式統計</button>
        <button class="ghost-btn" id="reset-all-btn">重置全部統計</button>
      </div>
    </div>
  </div>
</main>

<script>
window.__DEFAULT_VOCAB__ = [{"english_word": "A be followed by B", "chinese_definition": "接著，隨後，緊隨其後", "star_rating": 4, "toeic_score_range": "600-780", "category": "辦公日常", "parts_of_speech": ["verb"], "word_forms": [{"part_of_speech": "verb", "forms": ["A be followed by B", "follows", "following", "followed"]}], "examples": [{"english": "The meeting will be followed by a networking reception.", "chinese": "會議後將會舉辦一個社交活動。"}, {"english": "All orders are followed by a confirmation email.", "chinese": "所有訂單都會收到一封確認郵件。"}], "exam_tips": ["理解邏輯順序：此結構表示「A 先發生，然後 B 發生」。在 TOEIC 聽力第三、四部分的行程安排或閱讀第七部分的商務會議議程（Agenda）中，這是一個極其關鍵的時間順序指標。", "掌握被動與主動轉換：'A be followed by B' 的邏輯等同於 'B follows A'。考試時常在題目中使用被動語態，而在選項中改用主動語態或 'After A, B will happen' 來進行換句話說（Paraphrasing）的測驗。", "典型商業情境：最常見於會議流程，例如 'The keynote speech will be followed by a brief networking session'（主題演講後將進行簡短的交流時間），考生需注意 B 才是最後發生的事件。", "注意副詞搭配：常與 'immediately' 或 'shortly' 連用（如：is immediately followed by），用以強調兩個行程之間沒有空檔或間隔極短。", "易混淆詞辨析：區分 'A is followed by B' 與 'A follows B'。前者 A 在前，後者 B 在前。建議透過 'follow'（跟隨）的本義記憶：在 'A be followed by B' 中，B 是那個「跟在後面的跟隨者」。"]}, {"english_word": "a complete line of", "chinese_definition": "完整系列產品/服務", "star_rating": 4, "toeic_score_range": "600-780", "category": "採購與物流", "parts_of_speech": ["adjective", "noun"], "word_forms": [{"part_of_speech": "adjective", "forms": ["a complete line of", "more complete", "most complete"]}, {"part_of_speech": "noun", "forms": ["a complete line of", "complete lines"]}], "examples": [{"english": "We offer a complete line of office supplies, from pens to printers.", "chinese": "我們提供完整的辦公用品系列，從筆到印表機。"}, {"english": "The company is expanding its complete line of automotive parts to include electric vehicle components.", "chinese": "該公司正在擴展其完整的汽車零件系列，以包括電動汽車組件。"}], "exam_tips": ["常見搭配詞：此片語後方常接複數名詞，表示「全系列的產品」，例如 'a complete line of cosmetics' (全系列化妝品) 或 'a complete line of household appliances' (全系列家電)。", "商業情境應用：常見於公司簡介、產品廣告或供應商目錄，旨在強調產品多樣性 (diversity) 與齊全度，滿足一站式購物需求。", "易混淆詞辨析：需區分 'product line' (產品線) 與 'line of work' (職業/行業) 及 'line of credit' (信用額度)，在多益閱讀中必須依據上下文判斷 'line' 的具體商務含義。", "考試常見考點：在 Part 7 閱讀理解中，'a complete line of' 常作為關鍵字，其對應的正確選項常出現 'full range'、'wide selection' 或 'comprehensive' 等詞彙。", "答題注意事項：注意 'line' 是此片語的核心單數名詞，若其在主詞位置，後方的動詞需使用單數形式，例如 'A complete line of products is available'。"]}, {"english_word": "a copy of", "chinese_definition": "一份副本；一份複本（通常指文件或資料）", "star_rating": 5, "toeic_score_range": "400-600", "category": "辦公日常", "parts_of_speech": ["noun phrase"], "word_forms": [{"part_of_speech": "noun phrase", "forms": ["a copy of"]}], "examples": [{"english": "Could you please send me a copy of the contract for review?", "chinese": "您能請寄一份合約副本給我審閱嗎？"}, {"english": "The secretary made a copy of the report for each department head.", "chinese": "秘書為各部門主管製作了一份報告副本。"}], "exam_tips": ["常見搭配詞：在多益中常與文件相關名詞連用，例如 a copy of the contract (合約副本)、a copy of the report (報告複本)、a copy of the receipt (收據副本)。", "聽力測驗陷阱：在聽力第一、二部分中，需特別注意 copy 與 coffee 的發音辨析，考生常因發音相近而誤判情境。", "商業情境應用：常出現在辦公室行政、會議準備或商務書信中，用於要求、轉寄或附上文件，例如：'Please find attached a copy of the agenda.' (隨信附上議程一份)。", "閱讀測驗考點：在第五、六部分文法題中，需注意量詞的變化，若表達多份則需使用 'copies of'；在第七部分閱讀理解中，需區分 hard copy (紙本) 與 digital/electronic copy (電子檔) 的需求。", "易混淆詞辨析：需區分 copy (副本/複印本) 與 original (正本)，在合約簽署或證件提交的情境中，題目常會要求區分是要寄送正本還是影本。"]}, {"english_word": "a couple of", "chinese_definition": "一對，幾個（指兩個）", "star_rating": 5, "toeic_score_range": "0-400", "category": "溝通互動", "parts_of_speech": ["adjective", "determiner"], "word_forms": [{"part_of_speech": "adjective", "forms": ["a couple of", "more than a couple"]}], "examples": [{"english": "We need a couple of revisions before the presentation is finalized.", "chinese": "在簡報最終定稿之前，我們需要做一兩次修改。"}, {"english": "Could I see a couple of samples of your latest products, please?", "chinese": "請問我可以看看你們最新產品的幾樣樣品嗎？"}], "exam_tips": ["語意與數量掌握：a couple of 字面上指「一對」或「兩個」，但在 TOEIC 的商務口語情境中常指「兩三個」。在聽力測驗中，若聽到此詞，對應的正確選項常與數字 2 或 3 相關。", "文法限制：此片語後方必須接「複數可數名詞」（例如：a reat deal for business.'。", "商業情境：常用於描述大量資源投入或顯著的進步，例如：'The company spent a great deal of money on R&D.' 或 'Our workflow has improved a great deal.'。", "易混淆辨析：需區分 'a great deal of'（接不可數名詞）與 'a great many'（接複數可數名詞）；此外，單獨的 'deal' 在商務情境中常指『交易』，而 'a great deal' 則著重於『程度或量大』。", "考點分析：在 TOEIC Part 5 語法題中，常測驗考生是否知道其後應接不可數名詞；在 Part 7 閱讀理解中，則常用來修飾比較級以加強語氣，如 'a great deal better'。"]}, {"english_word": "a great deal of", "chinese_definition": "大量的；許多（用於不可數名詞）", "star_rating": 4, "toeic_score_range": "600-780", "category": "辦公日常", "parts_of_speech": ["adverb"], "word_forms": [{"part_of_speech": "adverb", "forms": ["a great deal of"]}], "examples": [{"english": "The company invested a great deal of money in research and development.", "chinese": "公司在研發上投入了大量的資金。"}, {"english": "We have a great deal of experience in handling international shipments.", "chinese": "我們在處理國際貨運方面擁有豐富的經驗。"}], "exam_tips": ["修飾詞性與搭配：'a great deal of' 專門用來修飾『不可數名詞』，等同於 much 或 a large amount of。常見搭配包括 a great deal of time, money, effort, pressure 或 information，這在 TOEIC 閱讀 Part 5 語法題中是常見的考點。", "易混淆詞辨析：考生必須區分 'a great deal of' (接不可數名詞) 與 'a great number of' (接可數複數名詞)。如果在填充題空格後看到複數名詞（如 guests, colleagues），則不能選 deal。", "商業應用情境：此片語常用於強調專案的投入、資源的耗費或市場的反應。例如：'The new marketing strategy attracted a great deal of attention.' (新的行銷策略吸引了大量關注)。", "聽力改寫 (Paraphrasing)：在聽力測驗中，對話內容若出現 'a great deal of'，正確選項往往會以 significant, substantial 或 considerable 等形容詞進行換照改寫。", "結構變體注意：'a great deal' 也可以單獨作為副詞使用，用來修飾動詞或形容詞比較級，例如：'The cost is a great deal higher than we expected.' (成本比我們預期的要高出許多)。"]}, {"english_word": "a large attendance", "chinese_definition": "出席人數眾多；參與人數龐大", "star_rating": 4, "toeic_score_range": "600-780", "category": "會議與簡報", "parts_of_speech": ["noun"], "word_forms": [{"part_of_speech": "noun", "forms": ["a large attendance", "large attendances"]}], "examples": [{"english": "The conference saw a large attendance, exceeding all expectations.", "chinese": "這次會議的出席人數非常踴躍，遠超預期。"}, {"english": "Due to the large attendance, we're moving the presentation to a larger venue.", "chinese": "由於出席人數眾多，我們將簡報搬到更大的場地。"}], "exam_tips": ["常見搭配詞：常與動詞 expect (預期)、attract (吸引) 或 draw (吸引) 連用，例如 expect a large attendance (預期有大量出席人數)。", "商業情境應用：主要出現在年度會議、研討會或產品發表會的報告中，用來描述活動參與的盛況。", "易混淆詞辨析：需嚴格區分 attendance (出席人數/出席行為) 與 attendant (服務人員/接待員，如 flight attendant)。在 TOEIC 詞彙題中，若空格前有形容詞 large 或 high，應選擇 attendance。", "聽力與閱讀考點：在閱讀 Part 7 的公告或信件中，若提到『a large attendance』，題目常會連結到『場地變更』或『需要更多座位』等後勤安排的細節。", "形容詞修飾語：除了 large 以外，TOEIC 考試中也常出現 high attendance 或 record attendance (破紀錄的出席人數) 來表達相同情境。"]}, {"english_word": "a letter of gratitude", "chinese_definition": "感謝信；表達感謝的書面信函，通常用於正式場合。", "star_rating": 4, "toeic_score_range": "600-780", "category": "溝通互動", "parts_of_speech": ["noun"], "word_forms": [{"part_of_speech": "noun", "forms": ["a letter of gratitude", "letters of gratitude"]}], "examples": [{"english": "After receiving excellent service, the manager sent a letter of gratitude to the hotel staff.", "chinese": "在獲得了卓越的服務後，經理向酒店員工寄了一封感謝信。"}, {"english": "We appreciate your prompt response and have enclosed a letter of gratitude for your assistance.", "chinese": "我們感謝您及時的回覆，並附上了一封感謝信以表達對您協助的感謝。"}], "exam_tips": ["常見搭配詞與同義替換：常用動詞包括 write, send, express, 或 convey。在 TOEIC 閱讀中，此詞組常與 'a thank-you note' 或 'a message of appreciation' 進行同義替換。", "商業情境應用：主要出現在面試後的後續追蹤（follow-up）、專案結案後的合作感謝，或是針對贊助者與捐款人的致意，展現專業職場禮儀。", "易混淆詞辨析：需嚴格區分 'gratitude'（感激）與 'gratuity'（小費）。前者用於心意表達，後者則出現在餐飲或服務業情境的帳單中，是 TOEIC 極常見的陷阱考點。", "考試出題重點：在 Part 7 的書信閱讀中，若題目詢問『寫信的目的』(What is the purpose of the letter?)，選項若出現 'To express appreciation' 或 'To thank a client'，則該信件通常即為 a letter of gratitude。", "聽力與答題策略：在 Part 3 或 Part 4 的對話與短文報告中，若聽到關鍵字 'appreciate' 或 'thankful'，應立即聯想至 letter of gratitude 相關的正式溝通情境，有助於預測問題答案。"]}, {"english_word": "a loaf of", "chinese_definition": "一條（麵包）；一整條（麵包）", "star_rating": 3, "toeic_score_range": "400-600", "category": "住宿與餐飲", "parts_of_speech": ["noun"], "word_forms": [{"part_of_speech": "noun", "forms": ["a loaf of", "loaves"]}], "examples": [{"english": "Could I have a loaf of whole wheat bread, please?", "chinese": "請問可以給我一條全麥麵包嗎？"}, {"english": "The bakery sells fresh loaves of bread every morning.", "chinese": "麵包店每天早上都販售新鮮麵包。"}], "exam_tips": ["常用搭配詞：此量詞最常接 'bread' (a loaf of bread)，在 TOEIC 聽力的餐飲情境中極為常見，務必掌握其複數型態為 'loaves'。", "商業與生活情境：常出現於 Part 1 照片描述題（如麵包店櫃檯）或 Part 3 辦公室茶水間供應與訂購情境，用於描述整條未切的麵包。", "文法辨析：需區分 'loaf' (整條) 與 'slice' (薄片)，在聽力測驗中，若圖片顯示的是多片吐司，使用 'loaves' 則是錯誤描述。", "拼寫與格位：注意其不規則複數變化 'loaves'，在 Part 5 文法題中可能考查單位詞的單複數一致性。", "字義區別：'loaf' 作為動詞時有 '閒逛、偷懶' 之意，但在 TOEIC 職場溝通情境中，幾乎皆以量詞 '一條' 的意義出現，應優先以此義理解。"]}, {"english_word": "a number of", "chinese_definition": "許多；大量（指不確定數量，通常用於表示多個事物）", "star_rating": 5, "toeic_score_range": "400-600", "category": "辦公日常", "parts_of_speech": ["adjective"], "word_forms": [{"part_of_speech": "adjective", "forms": ["a number of", "more numerous", "most numerous"]}], "examples": [{"english": "A number of employees have expressed concerns about the new policy.", "chinese": "許多員工對新政策表示擔憂。"}, {"english": "The company received a number of applications for the marketing position.", "chinese": "公司收到了許多針對行銷職位的申請。"}], "exam_tips": ["主詞動詞一致性：'a number of' 後接複數名詞時，動詞必須使用『複數』形式（例如：are, have, work），其意思等同於 'several' 或 'many'。", "易混淆詞辨析：極常與 'the number of' 做比較。'the number of' 指的是『...的數量』，焦點在於數量本身，因此動詞必須使用『單數』形式（例如：is, has, works），這是 Part 5 語法找錯題的必考重點。", "商業搭配詞：常與形容詞連用以表達程度，如 'a growing number of'（越來越多的）、'a significant number of'（相當多數量的）、'a large number of'（大量的）。", "聽力與閱讀同義替換：在 TOEIC 聽力 Part 3、4 或閱讀 Part 7 中，題目或選項常將 'a number of' 替換為 'various'、'multiple'、'several' 或 'some'。", "答題注意事項：看到 'number' 時，切勿反射性地選擇單數動詞，務必先辨認冠詞是 'a' 還是 'the'，並確認後方接的是否為可數複數名詞。"]}];

<script>/* ============ 資料處理 ============ */
let VOCAB = [];          // 增強後的單字陣列
let SCORE_RANGES = [];   // 依分數排序的區間清單
const MODE_KEYS = ['en2zh', 'zh2en', 'sentence', 'listening'];
const MODE_META = {
  en2zh:     { label: '單字→中文選擇', icon: 'translate' },
  zh2en:     { label: '中文→單字選擇', icon: 'g_translate' },
  sentence:  { label: '例句挖空選擇', icon: 'format_quote' },
  listening: { label: '聽力拼寫',     icon: 'hearing' }
};
const GAP_TABLE = [1, 2, 4, 8, 16, 30]; // Leitner box -> 間隔題數

let STATE = {
  modes: {} // per mode: { queue, correct:{}, wrong:{}, totalCorrect, totalWrong, box:{}, current, awaiting }
};

function splitMeanings(str) {
  return (str || '')
    .split(/[；，]/)
    .map(s => s.trim())
    .filter(Boolean);
}

function parseRangeStart(range) {
  const m = /(\d+)\s*-\s*(\d+)/.exec(range || '');
  return m ? parseInt(m[1], 10) : 0;
}

function buildVocab(raw) {
  VOCAB = raw.map((w, idx) => ({
    ...w,
    idx,
    meanings: splitMeanings(w.chinese_definition),
    forms: collectForms(w)
  }));
  const set = new Set(VOCAB.map(w => w.toeic_score_range || '未分級'));
  SCORE_RANGES = Array.from(set).sort((a, b) => parseRangeStart(a) - parseRangeStart(b));
}

function collectForms(w) {
  const forms = new Set();
  if (w.english_word) forms.add(w.english_word);
  (w.word_forms || []).forEach(g => (g.forms || []).forEach(f => forms.add(f)));
  return Array.from(forms).sort((a, b) => b.length - a.length);
}

/* ============ 統計 / SRS ============ */
const STATS_KEY = 'toeic_srs_stats_v1';

function freshModeStat() {
  const correct = {}, wrong = {};
  SCORE_RANGES.forEach(r => { correct[r] = 0; wrong[r] = 0; });
  return { correct, wrong, totalCorrect: 0, totalWrong: 0, box: {} };
}

function loadStats() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STATS_KEY) || 'null'); } catch (e) { saved = null; }
  MODE_KEYS.forEach(m => {
    const base = freshModeStat();
    if (saved && saved[m]) {
      SCORE_RANGES.forEach(r => {
        base.correct[r] = saved[m].correct?.[r] || 0;
        base.wrong[r] = saved[m].wrong?.[r] || 0;
      });
      base.totalCorrect = saved[m].totalCorrect || 0;
      base.totalWrong = saved[m].totalWrong || 0;
      base.box = saved[m].box || {};
    }
    STATE.modes[m] = {
      ...base,
      queue: shuffledIndices(m),
      current: null,
      awaiting: null
    };
  });
}

function persistStats() {
  const out = {};
  MODE_KEYS.forEach(m => {
    const s = STATE.modes[m];
    out[m] = { correct: s.correct, wrong: s.wrong, totalCorrect: s.totalCorrect, totalWrong: s.totalWrong, box: s.box };
  });
  try { localStorage.setItem(STATS_KEY, JSON.stringify(out)); } catch (e) { /* ignore quota */ }
}

function eligibleIndices(mode) {
  if (mode === 'sentence') return VOCAB.filter(w => w.examples && w.examples.length).map(w => w.idx);
  return VOCAB.map(w => w.idx);
}

function shuffledIndices(mode) {
  const arr = eligibleIndices(mode);
  shuffle(arr);
  return arr;
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function recordAnswer(mode, wordIdx, correct) {
  const s = STATE.modes[mode];
  const range = VOCAB[wordIdx].toeic_score_range || '未分級';
  if (correct) {
    s.correct[range] = (s.correct[range] || 0) + 1;
    s.totalCorrect++;
  } else {
    s.wrong[range] = (s.wrong[range] || 0) + 1;
    s.totalWrong++;
  }
  const prevBox = s.box[wordIdx] || 1;
  const nextBox = correct ? Math.min(prevBox + 1, GAP_TABLE.length) : 1;
  s.box[wordIdx] = nextBox;
  const gap = GAP_TABLE[nextBox - 1];

  // queue[0] 一定是剛作答的 wordIdx，移除後依 gap 重新插入（SRS 間隔重複）
  s.queue.shift();
  const insertPos = Math.min(s.queue.length, gap);
  s.queue.splice(insertPos, 0, wordIdx);

  persistStats();
}

function resetModeStats(mode) {
  STATE.modes[mode] = { ...freshModeStat(), queue: shuffledIndices(mode), current: null, awaiting: null };
  persistStats();
}

function resetAllStats() {
  MODE_KEYS.forEach(resetModeStats);
}

/* ============ 出題邏輯 ============ */
function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function buildQuestionEn2Zh(wordIdx) {
  const word = VOCAB[wordIdx];
  const correctMeaning = pickRandom(word.meanings.length ? word.meanings : [word.chinese_definition]);
  const otherWords = VOCAB.filter(w => w.idx !== wordIdx && w.meanings.length);
  shuffle(otherWords);
  const distractors = [];
  const seen = new Set([correctMeaning]);
  for (const w of otherWords) {
    if (distractors.length >= 4) break;
    const m = pickRandom(w.meanings);
    if (!seen.has(m)) { seen.add(m); distractors.push(m); }
  }
  const options = shuffle([correctMeaning, ...distractors]);
  return { prompt: word.english_word, options, answer: correctMeaning, word };
}

function buildQuestionZh2En(wordIdx) {
  const word = VOCAB[wordIdx];
  const promptMeaning = pickRandom(word.meanings.length ? word.meanings : [word.chinese_definition]);
  const otherWords = VOCAB.filter(w => w.idx !== wordIdx);
  shuffle(otherWords);
  const distractors = otherWords.slice(0, 4).map(w => w.english_word);
  const options = shuffle([word.english_word, ...distractors]);
  return { prompt: promptMeaning, options, answer: word.english_word, word };
}

function buildQuestionSentence(wordIdx) {
  const word = VOCAB[wordIdx];
  if (!word.examples || !word.examples.length) return null;
  const example = pickRandom(word.examples);
  const blanked = blankOutWord(example.english, word.forms);
  const otherWords = VOCAB.filter(w => w.idx !== wordIdx);
  const distractors = pickSentenceDistractors(word, otherWords);
  const options = shuffle([word.english_word, ...distractors]);
  return { prompt: blanked.text, options, answer: word.english_word, word, example, matched: blanked.matched };
}

// 介係詞清單：片語題目的干擾選項須與正解共用第一個或最後一個介係詞
const PREPOSITIONS = ['at', 'by', 'for', 'from', 'under', 'without', 'with', 'to', 'while', 'during', 'on'];

function isPhrase(str) { return /\s/.test((str || '').trim()); }

function phrasePrepositions(phrase) {
  const words = (phrase || '').toLowerCase().trim().split(/\s+/).map(w => w.replace(/[^a-z]/g, ''));
  return {
    first: PREPOSITIONS.includes(words[0]) ? words[0] : null,
    last: PREPOSITIONS.includes(words[words.length - 1]) ? words[words.length - 1] : null
  };
}

function pickSentenceDistractors(word, otherWords) {
  const answer = word.english_word;

  // 正解不是片語（單一字元的單字）：一般隨機挑選干擾項即可
  if (!isPhrase(answer)) {
    return shuffle(otherWords.slice()).slice(0, 4).map(w => w.english_word);
  }

  // 正解是片語：干擾選項必須也是片語，且第一個/最後一個介係詞需與正解相符
  const ansPrep = phrasePrepositions(answer);
  const phraseCandidates = otherWords.filter(w => isPhrase(w.english_word));

  let primary = [];
  if (ansPrep.first || ansPrep.last) {
    primary = phraseCandidates.filter(w => {
      const p = phrasePrepositions(w.english_word);
      return (ansPrep.first && (p.first === ansPrep.first || p.last === ansPrep.first)) ||
             (ansPrep.last && (p.first === ansPrep.last || p.last === ansPrep.last));
    });
  }
  shuffle(primary);

  const usedIdx = new Set(primary.map(w => w.idx));
  const secondary = shuffle(phraseCandidates.filter(w => !usedIdx.has(w.idx))); // 其他片語（介係詞不同，但仍優先於單字）
  const tertiary = shuffle(otherWords.filter(w => !isPhrase(w.english_word))); // 題庫片語不足時才退回單一單字

  return [...primary, ...secondary, ...tertiary].slice(0, 4).map(w => w.english_word);
}

function blankOutWord(sentence, forms) {
  for (const form of forms) {
    const escaped = form.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('\\b' + escaped + '\\b', 'i');
    if (re.test(sentence)) {
      return { text: sentence.replace(re, '_____'), matched: true };
    }
  }
  // 找不到精確符合形式時，退而求其次直接嘗試整串比對
  return { text: sentence, matched: false };
}

function maskListeningWord(word) {
  const chars = word.split('');
  const nonSpaceIdx = [];
  chars.forEach((c, i) => { if (/\S/.test(c)) nonSpaceIdx.push(i); });
  const firstIdx = nonSpaceIdx[0];
  const lastIdx = nonSpaceIdx[nonSpaceIdx.length - 1];
  return chars.map((c, i) => {
    if (c === ' ') return ' ';
    if (i === firstIdx || i === lastIdx) return c.toUpperCase();
    return '_';
  }).join('');
}

function normalizeAnswer(s) {
  return (s || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

/* ============ TTS ============ */
function speakWord(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

/* ============ 畫面渲染 ============ */
let currentMode = 'en2zh';

const el = id => document.getElementById(id);

function initApp() {
  loadStats();
  el('word-count').textContent = VOCAB.length;
  MODE_KEYS.forEach(m => {
    el('tab-' + m).addEventListener('click', () => switchMode(m));
  });
  el('reset-all-btn').addEventListener('click', () => {
    if (confirm('確定要清除全部模式的作答統計與複習進度嗎？此動作無法復原。')) {
      resetAllStats();
      renderMode(currentMode);
    }
  });
  el('reset-mode-btn').addEventListener('click', () => {
    if (confirm('確定要清除「' + MODE_META[currentMode].label + '」模式的統計與複習進度嗎？')) {
      resetModeStats(currentMode);
      renderMode(currentMode);
    }
  });
  switchMode('en2zh');
}

function switchMode(mode) {
  currentMode = mode;
  MODE_KEYS.forEach(m => {
    const btn = el('tab-' + m);
    btn.classList.toggle('mode-tab-active', m === mode);
  });
  renderMode(mode);
}

function renderMode(mode) {
  const s = STATE.modes[mode];
  if (!s.queue.length) {
    el('quiz-area').innerHTML = '<p class="empty-note">此模式目前沒有可用的題目（例如例句挖空模式需要單字含有例句）。</p>';
    renderStats(mode);
    return;
  }
  const wordIdx = s.queue[0];
  s.current = wordIdx;
  s.awaiting = true;

  let q;
  if (mode === 'en2zh') q = buildQuestionEn2Zh(wordIdx);
  else if (mode === 'zh2en') q = buildQuestionZh2En(wordIdx);
  else if (mode === 'sentence') q = buildQuestionSentence(wordIdx);

  if (mode === 'listening') {
    renderListening(wordIdx);
  } else {
    renderChoiceQuestion(mode, q);
  }
  renderStats(mode);
}

function renderChoiceQuestion(mode, q) {
  const box = el('quiz-area');
  const promptLabel = mode === 'en2zh' ? '請選出正確的中文意思' :
    mode === 'zh2en' ? '請選出對應的英文單字/片語' : '請選出最適合填入空格的單字';
  const promptClass = mode === 'sentence' ? 'quiz-prompt quiz-prompt--sentence' : 'quiz-prompt';

  box.innerHTML = `
    <p class="quiz-label">${promptLabel}</p>
    <div class="${promptClass}">${escapeHtml(q.prompt)}</div>
    <div class="options-grid" id="options-grid"></div>
    <div id="feedback-panel" class="feedback-panel hidden"></div>
  `;
  const grid = el('options-grid');
  q.options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'option-btn';
    b.textContent = opt;
    b.addEventListener('click', () => handleChoiceAnswer(mode, q, opt, b));
    grid.appendChild(b);
  });
}

function handleChoiceAnswer(mode, q, chosen, btnEl) {
  const s = STATE.modes[mode];
  if (!s.awaiting) return;
  s.awaiting = false;
  const correct = chosen === q.answer;
  document.querySelectorAll('#options-grid .option-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.answer) b.classList.add('option-correct');
    else if (b === btnEl) b.classList.add('option-wrong');
  });
  recordAnswer(mode, q.word.idx, correct);
  showFeedback(mode, correct, q.word, mode === 'sentence' ? q.example : null);
  renderStats(mode);
}

function renderListening(wordIdx) {
  const word = VOCAB[wordIdx];
  const box = el('quiz-area');
  box.innerHTML = `
    <p class="quiz-label">聆聽發音，並依提示字母拼出完整單字/片語</p>
    <div class="listening-controls">
      <button id="play-btn" class="play-btn">
        <span class="material-icons-round">volume_up</span> 播放發音
      </button>
      <span class="mask-hint" id="mask-hint">${escapeHtml(maskListeningWord(word.english_word))}</span>
    </div>
    <form id="listen-form" class="listen-form">
      <input id="listen-input" type="text" autocomplete="off" placeholder="請輸入完整拼寫" class="listen-input" />
      <button type="submit" class="submit-btn">送出答案</button>
    </form>
    <div id="feedback-panel" class="feedback-panel hidden"></div>
  `;
  el('play-btn').addEventListener('click', () => speakWord(word.english_word));
  el('listen-form').addEventListener('submit', (e) => {
    e.preventDefault();
    handleListeningAnswer(word);
  });
  setTimeout(() => speakWord(word.english_word), 300);
  el('listen-input').focus();
}

function handleListeningAnswer(word) {
  const s = STATE.modes.listening;
  if (!s.awaiting) return;
  const input = el('listen-input');
  const val = input.value;
  input.disabled = true;
  el('listen-form').querySelector('button[type=submit]').disabled = true;
  const correct = normalizeAnswer(val) === normalizeAnswer(word.english_word);
  s.awaiting = false;
  input.classList.add(correct ? 'input-correct' : 'input-wrong');
  recordAnswer('listening', word.idx, correct);
  showFeedback('listening', correct, word, null, val);
  renderStats('listening');
}

function showFeedback(mode, correct, word, example, userInput) {
  const panel = el('feedback-panel');
  panel.classList.remove('hidden');
  const tip = (word.exam_tips && word.exam_tips[0]) ? word.exam_tips[0] : '';
  const exampleHtml = (example)
    ? `<p class="feedback-example">${escapeHtml(example.english)}<br><span class="feedback-example-zh">${escapeHtml(example.chinese)}</span></p>`
    : ((word.examples && word.examples[0]) ? `<p class="feedback-example">${escapeHtml(word.examples[0].english)}<br><span class="feedback-example-zh">${escapeHtml(word.examples[0].chinese)}</span></p>` : '');
  const wrongLine = (!correct && userInput !== undefined)
    ? `<p class="feedback-your-answer">你的輸入：<span>${escapeHtml(userInput || '（空白）')}</span></p>` : '';

  panel.innerHTML = `
    <div class="feedback-head ${correct ? 'feedback-head--correct' : 'feedback-head--wrong'}">
      <span class="material-icons-round">${correct ? 'check_circle' : 'cancel'}</span>
      <span>${correct ? '答對了！' : '答錯了，已排入複習佇列'}</span>
    </div>
    <p class="feedback-word">${escapeHtml(word.english_word)}　<span class="feedback-range">${escapeHtml(word.toeic_score_range || '')}</span></p>
    <p class="feedback-meaning">${escapeHtml(word.chinese_definition)}</p>
    ${wrongLine}
    ${exampleHtml}
    ${tip ? `<p class="feedback-tip"><span class="material-icons-round" style="font-size:16px;vertical-align:-3px;">lightbulb</span> ${escapeHtml(tip)}</p>` : ''}
    <button id="next-btn" class="next-btn">下一題 <span class="material-icons-round" style="font-size:18px;vertical-align:-4px;">arrow_forward</span></button>
  `;
  el('next-btn').addEventListener('click', () => renderMode(mode));
}

function renderStats(mode) {
  const s = STATE.modes[mode];
  const total = s.totalCorrect + s.totalWrong;
  const acc = total ? Math.round((s.totalCorrect / total) * 100) : 0;

  el('stat-total').textContent = total;
  el('stat-correct').textContent = s.totalCorrect;
  el('stat-wrong').textContent = s.totalWrong;
  el('stat-acc').textContent = acc + '%';

  const reviewCount = Object.values(s.box).filter(b => b === 1).length;
  el('stat-review').textContent = reviewCount;

  const rangeBody = el('range-stats-body');
  rangeBody.innerHTML = '';
  const maxCount = Math.max(1, ...SCORE_RANGES.map(r => Math.max(s.correct[r] || 0, s.wrong[r] || 0)));
  SCORE_RANGES.forEach(r => {
    const c = s.correct[r] || 0;
    const w = s.wrong[r] || 0;
    const row = document.createElement('div');
    row.className = 'range-row';
    row.innerHTML = `
      <div class="range-label">${escapeHtml(r)}</div>
      <div class="range-bars">
        <div class="range-bar-track">
          <div class="range-bar range-bar--correct" style="width:${(c / maxCount) * 100}%"></div>
        </div>
        <span class="range-num range-num--correct">${c}</span>
      </div>
      <div class="range-bars">
        <div class="range-bar-track">
          <div class="range-bar range-bar--wrong" style="width:${(w / maxCount) * 100}%"></div>
        </div>
        <span class="range-num range-num--wrong">${w}</span>
      </div>
    `;
    rangeBody.appendChild(row);
  });
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

/* ============ 上傳自訂 JSON ============ */
function handleFileUpload(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      let text = e.target.result.replace(/^\uFEFF/, '');
      text = text.replace(/,(\s*)\]\s*$/, '$1]'); // 容忍結尾多餘逗號
      const data = JSON.parse(text);
      if (!Array.isArray(data) || !data.length) throw new Error('格式不符');
      buildVocab(data);
      loadStats();
      el('word-count').textContent = VOCAB.length;
      switchMode(currentMode);
      // 手動上傳也視為外源資料，成功後同樣隱藏提示徽章
      setSourceStatus('<span class="material-icons-round" style="font-size:14px;">cloud_done</span> ' + escapeHtml(file.name) + '（手動上傳）', false, true);
      alert('已成功載入 ' + VOCAB.length + ' 筆單字資料！');
    } catch (err) {
      alert('載入失敗：JSON 格式無法解析。' + err.message);
    }
  };
  reader.readAsText(file, 'utf-8');
}

/* ============ 啟動 ============ */
function setSourceStatus(html, warn, hide) {
  const pill = el('data-source-pill');
  const container = el('source-status');
  if (pill) {
    pill.innerHTML = html;
    pill.classList.toggle('pill-warn', !!warn);
  }
  if (container) container.classList.toggle('hidden', !!hide);
}

window.addEventListener('DOMContentLoaded', () => {
  fetch('toeic_vocabulary.json', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      if (!Array.isArray(data) || !data.length) throw new Error('資料為空或格式不符');
      buildVocab(data);
      initApp();
      // 已成功讀取外源資料（toeic_vocabulary.json），隱藏提示徽章
      setSourceStatus('<span class="material-icons-round" style="font-size:14px;">cloud_done</span> toeic_vocabulary.json', false, true);
    })
    .catch(err => {
      console.warn('讀取 toeic_vocabulary.json 失敗，改用內建範例資料：', err);
      buildVocab(window.__DEFAULT_VOCAB__ || []);
      initApp();
      // 使用內建範例資料時保留提示，讓使用者知道尚未讀到外部題庫
      setSourceStatus('<span class="material-icons-round" style="font-size:14px;">warning</span> 內建範例資料（找不到 toeic_vocabulary.json）', true, false);
    });
  el('json-file-input').addEventListener('change', handleFileUpload);
});

</script>
